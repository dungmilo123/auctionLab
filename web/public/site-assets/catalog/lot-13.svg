<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-labelledby="title desc"><title id="title">Midnight jazz record</title><desc id="desc">Project-authored vector object study with neutral light and material detail.</desc><defs>
